services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alandas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-alandas_system1}
    volumes:
      - system1-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    build:
      context: .
      dockerfile: deployment/temporal/Dockerfile
      args:
        TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.27.2}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?}
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.0}
    profiles:
      - tools
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    stdin_open: true
    tty: true
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.39.0}
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:8080}
    restart: unless-stopped

  temporal-ui-gateway:
    build:
      context: ./deployment/temporal-ui-gateway
      dockerfile: Dockerfile
    depends_on:
      - temporal-ui
    environment:
      TEMPORAL_UI_AUTH_USER: ${TEMPORAL_UI_AUTH_USER:?}
      # Coolify must store this as a literal value so bcrypt's `$` characters
      # reach Caddy unchanged.
      TEMPORAL_UI_AUTH_PASSWORD_HASH: ${TEMPORAL_UI_AUTH_PASSWORD_HASH:?}
    restart: unless-stopped

  system1-worker:
    build:
      context: .
      dockerfile: system_1/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-alandas-system1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alandas}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-alandas_system1}
      SYSTEM1_AUDIT_PATH: /app/runtime/audit/system1_audit.jsonl
      SYSTEM1_LEADS_PATH: /app/runtime/leads
      SYSTEM1_PUBLIC_RESEARCH_ENABLED: ${SYSTEM1_PUBLIC_RESEARCH_ENABLED:-false}
      # Discovery is fail-closed. A later operator command checks this before
      # it can contact either provider.
      SYSTEM1_DISCOVERY_ENABLED: ${SYSTEM1_DISCOVERY_ENABLED:-false}
      SYSTEM1_DISCOVERY_MAX_APIFY_USD: ${SYSTEM1_DISCOVERY_MAX_APIFY_USD:-1.40}
      SYSTEM1_DISCOVERY_MAX_OUTSCRAPER_USD: ${SYSTEM1_DISCOVERY_MAX_OUTSCRAPER_USD:-0.60}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - system1-runtime:/app/runtime
    restart: unless-stopped

  system1-webhook:
    build:
      context: .
      dockerfile: system_1/Dockerfile.webhook
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-alandas-system1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alandas}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-alandas_system1}
      SYSTEM1_OUTSCRAPER_WEBHOOK_ENABLED: ${SYSTEM1_OUTSCRAPER_WEBHOOK_ENABLED:-false}
      OUTSCRAPER_WEBHOOK_TOKEN: ${OUTSCRAPER_WEBHOOK_TOKEN:?}
      SYSTEM1_WEBHOOK_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

volumes:
  system1-postgres-data:
  temporal-postgres-data:
  system1-runtime:
