services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alandas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-alandas_system1}
    volumes:
      - system1-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./deployment/postgres/init/01-system1-schema.sql
        target: /docker-entrypoint-initdb.d/01-system1-schema.sql
        content: |
          CREATE TABLE IF NOT EXISTS leads (
              workflow_id TEXT PRIMARY KEY,
              venue_name TEXT NOT NULL,
              city TEXT NOT NULL,
              venue_type TEXT NOT NULL,
              source_url TEXT NOT NULL,
              website TEXT NOT NULL DEFAULT '',
              instagram TEXT NOT NULL DEFAULT '',
              email TEXT NOT NULL DEFAULT '',
              phone TEXT NOT NULL DEFAULT '',
              impressum_url TEXT NOT NULL DEFAULT '',
              decision_maker TEXT NOT NULL DEFAULT '',
              seat_estimate INTEGER,
              fit_score INTEGER,
              fit_reason TEXT NOT NULL DEFAULT '',
              status TEXT NOT NULL DEFAULT 'new',
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS audit_events (
              id BIGSERIAL PRIMARY KEY,
              workflow_id TEXT NOT NULL,
              event_name TEXT NOT NULL,
              status TEXT NOT NULL,
              details JSONB NOT NULL DEFAULT '{}'::JSONB,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.27.2}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?}
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - type: bind
        source: ./deployment/temporal/dynamicconfig/development-sql.yaml
        target: /etc/temporal/config/dynamicconfig/development-sql.yaml
        content: |
          system.forceSearchAttributesCacheRefreshOnRead:
            - value: true
              constraints: {}
    restart: unless-stopped

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.0}
    profiles:
      - tools
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    stdin_open: true
    tty: true
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.39.0}
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:8080}
    restart: unless-stopped

  temporal-ui-gateway:
    image: caddy:2.8.4-alpine
    depends_on:
      - temporal-ui
    environment:
      TEMPORAL_UI_AUTH_USER: ${TEMPORAL_UI_AUTH_USER:?}
      TEMPORAL_UI_AUTH_PASSWORD_HASH: ${TEMPORAL_UI_AUTH_PASSWORD_HASH:?}
    volumes:
      - type: bind
        source: ./deployment/temporal-ui-gateway/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        content: |
          {
              auto_https off
              admin off
          }

          :80 {
              basic_auth {
                  {$TEMPORAL_UI_AUTH_USER} {$TEMPORAL_UI_AUTH_PASSWORD_HASH}
              }

              reverse_proxy temporal-ui:8080
          }
    restart: unless-stopped

  system1-worker:
    build:
      context: .
      dockerfile: system_1/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-alandas-system1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alandas}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-alandas_system1}
      SYSTEM1_AUDIT_PATH: /app/runtime/audit/system1_audit.jsonl
      SYSTEM1_LEADS_PATH: /app/runtime/leads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - system1-runtime:/app/runtime
    restart: unless-stopped

volumes:
  system1-postgres-data:
  temporal-postgres-data:
  system1-runtime:
